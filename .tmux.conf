unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set-option -g default-shell /bin/bash
set-option -g renumber-windows on
# default list minus WAYLAND_DISPLAY — attach from ssh/tty must not unset it
# (unset kills wl-paste in new panes -> claude image paste dead until restart)
set-option -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE"

# closing a session moves client to the most recently used one; detach only when none left
set -g detach-on-destroy off

set -g automatic-rename off
set -g allow-rename off

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g set-clipboard on
set -as terminal-features ',alacritty:clipboard:hyperlinks'

bind r source-file ~/.tmux.conf

# statusline: transparent bg, grey inactive / green active windows,
# session on the right (inverted while prefix is active)
set -g status-style "#{?client_prefix,fg=black bg=colour245,fg=colour245 bg=default}"
set -g status-left ""
set -g status-right " #S "
set -g window-status-format " #I:#W "
set -g window-status-style "#{?client_prefix,fg=black,fg=colour245}"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=green"

# bell latch: Claude Code rings terminal bell (preferredNotifChannel=terminal_bell)
# on permission prompts + finished turns; tab stays highlighted until visited.
# bell-action any forwards BEL to the client terminal -> alacritty requests
# attention when unfocused -> sway marks the workspace urgent
set -g bell-action any
set -g visual-bell off
set -wg monitor-bell on
set -g window-status-bell-style "fg=#f38ba8,bg=default,bold"

# cross-session bells: bell-action only reaches clients of the ringing session,
# so the hook rings every other attached client too; prefix a = picker of
# bell-flagged windows across all sessions (Enter jumps + clears the flag)
set-hook -g alert-bell 'run-shell -b "~/.config/tmux/bell-all.sh #{session_name}"'
bind a run-shell '~/.config/tmux/attention.sh "#{client_name}" "#{pane_id}"'
set -g tree-mode-preview-format ''


# mouse: scroll + select-copy without jumping to bottom
set -g mouse on
set -g history-limit 100000
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

